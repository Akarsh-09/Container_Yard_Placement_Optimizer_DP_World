<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>
    body{margin:0;font-family:var(--font-sans);color:var(--foreground)}label{font-size:13px}select{font:inherit;background:var(--card);color:var(--foreground);border:1px solid var(--border);border-radius:var(--radius);padding:6px;margin-left:8px}svg{width:100%;height:350px}text{fill:var(--foreground);font-size:12px}.base{fill:var(--chart-2)}.candidate{fill:var(--chart-1)}.best{fill:var(--chart-3)}p{font-size:12px;color:var(--muted-foreground);margin:0;line-height:1.5}
    </style></head><body><label>Metric<select id="metric"><option value="total">Full-train reshuffles</option><option value="early">Days 1–12 / found retrieval</option><option value="late">Days 13–20 / found retrieval</option></select></label><svg id="chart" viewBox="0 0 660 350" role="img" aria-label="Phase 2 training comparison"></svg><p>Lower is better. Period rates exclude absent targets. All candidates use fixed rules; no test data was accessed.</p><script>
    const rows=[{"name": "Greedy", "total": 8036, "early": 0.82070606902023, "late": 1.017223382045929}, {"name": "raw_strict", "total": 8886, "early": 0.9393097976993257, "late": 1.0829853862212944}, {"name": "raw_nonstrict", "total": 9294, "early": 1.0392701309004364, "late": 1.0579331941544885}, {"name": "raw_top_only", "total": 9575, "early": 0.9894882982943276, "late": 1.1967640918580376}, {"name": "s1_stored_order", "total": 8956, "early": 0.9646965489884967, "late": 1.067849686847599}, {"name": "s2_rollover", "total": 8578, "early": 0.9406981356604522, "late": 1.0007828810020878}, {"name": "s3_next_feasible", "total": 8394, "early": 0.9020230067433558, "late": 1.0036534446764092}, {"name": "Random mean (5 seeds)", "total": 8969.6, "early": 0.9324077746925823, "late": 1.1138830897703549}];const ns='http://www.w3.org/2000/svg';function add(tag,attrs,text){const e=document.createElementNS(ns,tag);for(const [k,v] of Object.entries(attrs))e.setAttribute(k,v);if(text!==undefined)e.textContent=text;document.querySelector('#chart').appendChild(e);return e}function render(){document.querySelector('#chart').replaceChildren();const key=document.querySelector('#metric').value;const limit=Math.max(...rows.map(r=>r[key]))*1.13;rows.forEach((r,i)=>{let y=12+i*42;add('text',{x:0,y:y+15},r.name);const bar=add('rect',{x:175,y:y+1,width:r[key]/limit*420,height:21,rx:3,class:r.name==='Greedy'?'base':r.name==='s3_next_feasible'?'best':'candidate'});const title=document.createElementNS(ns,'title');title.textContent=r.name+': '+r[key];bar.appendChild(title);add('text',{x:182+r[key]/limit*420,y:y+16},key==='total'?r[key].toLocaleString('en-US',{maximumFractionDigits:1}):r[key].toFixed(4))})}document.querySelector('#metric').addEventListener('change',render);render();
    </script></body></html>
