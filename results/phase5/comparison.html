<!doctype html><html><head><meta charset="utf-8"><style>body{margin:0;font:14px var(--font-sans);color:var(--foreground)}select{font:inherit;color:var(--foreground);background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:5px}p{font-size:12px;line-height:1.5;color:var(--muted-foreground)}strong{color:var(--destructive)}svg{height:175px;width:100%}text{font:12px var(--font-sans);fill:var(--foreground)}</style></head><body><p><strong>Official test error gate failed: 9,861 exceptions.</strong><br>The MyStrategy bar records simulator fallback placements. It does not measure successful SurvivalRisk decisions.</p><select id="metric"><option value="r">Test reshuffles per retrieval</option><option value="n">Test total reshuffles</option></select><svg id="chart" viewBox="0 0 700 175" role="img" aria-label="Official failed test output and unchanged baseline results"></svg><script>const rows=[{"name": "Random \u00b7 five-seed mean", "r": 0.8398258525966622, "n": 8101.8}, {"name": "Greedy", "r": 0.7687363947341143, "n": 7416}, {"name": "MyStrategy \u00b7 fallback", "r": 1.0422929408106147, "n": 10055}],ns='http://www.w3.org/2000/svg';function add(tag,a,t){let e=document.createElementNS(ns,tag);for(let[k,v]of Object.entries(a))e.setAttribute(k,v);if(t!==undefined)e.textContent=t;document.querySelector('#chart').appendChild(e)}function draw(){document.querySelector('#chart').replaceChildren();let key=document.querySelector('#metric').value,max=Math.max(...rows.map(r=>r[key]))*1.13;rows.forEach((r,i)=>{let y=13+i*49,w=r[key]/max*450;add('text',{x:0,y:y+17},r.name);add('rect',{x:190,y,width:w,height:26,rx:3,fill:i===2?'var(--destructive)':'var(--chart-'+(i+1)+')'});add('text',{x:196+w,y:y+17},key==='r'?r[key].toFixed(4):r[key].toLocaleString())})}document.querySelector('#metric').onchange=draw;draw();</script></body></html>
