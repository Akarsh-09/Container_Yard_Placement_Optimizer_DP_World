<!doctype html><html><head><meta charset="utf-8"><style>body{margin:0;font:14px var(--font-sans);color:var(--foreground)}select{font:inherit;color:var(--foreground);background:var(--card);border:1px solid var(--border);padding:5px;border-radius:var(--radius)}svg{width:100%;height:170px}text{font:12px var(--font-sans);fill:var(--foreground)}p{font-size:12px;color:var(--muted-foreground)}</style></head><body><select id="metric"><option value="count">Train reshuffles</option><option value="early">Days 1–12 · reshuffles / found retrieval</option><option value="late">Days 13–20 · reshuffles / found retrieval</option></select><svg viewBox="0 0 700 170" id="chart" role="img" aria-label="Frozen strategy versus unchanged training baselines"></svg><p>Frozen default verified: 10,385 cached/live decisions identical; CLI 11.55s / 11.54s. Test data remains unopened.</p><script>const rows=[{"name": "Random \u00b7 seeds 0\u20134 mean", "count": 8969.6, "early": 0.9324077746925823, "late": 1.1138830897703549}, {"name": "Greedy", "count": 8036, "early": 0.82070606902023, "late": 1.017223382045929}, {"name": "Frozen MyStrategy", "count": 6408, "early": 0.6418088060293534, "late": 0.8277661795407099}],ns='http://www.w3.org/2000/svg';function add(tag,attrs,text){let e=document.createElementNS(ns,tag);for(let[k,v]of Object.entries(attrs))e.setAttribute(k,v);if(text!==undefined)e.textContent=text;document.querySelector('#chart').appendChild(e)}function draw(){document.querySelector('#chart').replaceChildren();let key=document.querySelector('#metric').value,max=Math.max(...rows.map(r=>r[key]))*1.13;rows.forEach((r,i)=>{let y=15+i*48,w=r[key]/max*460;add('text',{x:0,y:y+17},r.name);add('rect',{x:180,y,width:w,height:26,rx:3,fill:'var(--chart-'+(i+1)+')'});add('text',{x:186+w,y:y+17},key==='count'?r[key].toLocaleString():r[key].toFixed(4))})}document.querySelector('#metric').onchange=draw;draw();</script></body></html>
